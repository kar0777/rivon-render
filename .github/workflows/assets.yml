name: assets
# Fetches CC0 Poly Haven files on a runner with open internet and pushes them to branch assets-out/<name>.
# Trigger: push a branch assets/<name> containing tools/assets_job.json: {"name":"scan","mode":"scan"} or {"name":"pick1","mode":"fetch","hdris":["id"],"models":["id"],"hdri_res":"2k","model_res":"1k"}
on:
  push:
    branches: ['assets/**']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          NAME=$(jq -r .name tools/assets_job.json); MODE=$(jq -r .mode tools/assets_job.json)
          mkdir -p /tmp/out
          if [ "$MODE" = "scan" ]; then python3 tools/ph_scan.py /tmp/out; else python3 tools/ph_fetch.py tools/assets_job.json /tmp/out; fi
          du -sh /tmp/out; ls /tmp/out | head
          cd /tmp/out && git init -q -b assets-out/$NAME && git config user.name ci && git config user.email ci@example.com && git add -A && git commit -q -m "assets $NAME"
          for t in 1 2 3 4 5; do git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" assets-out/$NAME && break; sleep 15; done
